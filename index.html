                            ...p,
                            cartItems: p.cartItems.map((c) =>
                              c.id === item.id ? { ...c, quantity: Math.max(0.5, c.quantity - (c.quantity > 1 ? 1 : 0.5)) } : c
                            )
                          }))}
                          className="w-8 h-8 rounded-full bg-softsage flex items-center justify-center text-charcoal"
                        >
                          <Icon name="minus" className="w-3.5 h-3.5" />
                        </button>
                        <span onClick={() => setEditingItem(item)} className="text-xs font-medium px-1 cursor-pointer">
                          {formatCompact(item.quantity)} {item.unit}
                        </span>
                        <button
                          onClick={() => updateData((p) => ({
                            ...p,
                            cartItems: p.cartItems.map((c) => (c.id === item.id ? { ...c, quantity: c.quantity + 1 } : c))
                          }))}
                          className="w-8 h-8 rounded-full bg-softolive flex items-center justify-center text-deepolive"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                      <span className={`font-num font-bold text-base ${item.isSelected ? 'text-deepolive' : 'text-mutedolive'}`}>
                        {formatBaht(item.quantity * item.unitPrice)}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </>
          ) : (
            <div className="bg-white rounded-2xl p-7 border border-sageborder text-center flex flex-col items-center">
              <div className="w-16 h-16 rounded-full bg-softolive text-olive flex items-center justify-center mb-3">
                <Icon name="cart" className="w-8 h-8" />
              </div>
              <div className="font-semibold text-base text-charcoal">ตะกร้ารายการซื้อยังว่างอยู่</div>
              <div className="text-xs text-mutedolive mt-1">กดปุ่ม "+ เพิ่มสินค้า" เพื่อบันทึกรายการและคำนวณงบแบบเรียลไทม์</div>
              <button
                onClick={() => setShowAddSheet(true)}
                className="mt-4 h-11 px-5 rounded-xl bg-olive text-white text-sm font-semibold flex items-center gap-1.5"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>เพิ่มรายการแรก</span>
              </button>
            </div>
          )}

          {/* Floating Add Item Button */}
          <button
            onClick={() => setShowAddSheet(true)}
            className={`fixed right-4 z-20 h-12 px-4 rounded-2xl bg-olive text-white font-semibold text-sm shadow-lg flex items-center gap-1.5 active:scale-95 transition ${
              items.length > 0 ? 'bottom-36' : 'bottom-20'
            }`}
          >
            <Icon name="plus" className="w-4 h-4" />
            <span>เพิ่มสินค้า</span>
          </button>

          {/* Bottom Checkout Bar */}
          {items.length > 0 && (
            <div className="fixed bottom-16 inset-x-0 z-20 bg-white border-t border-sageborder safe-bottom">
              <div className="max-w-xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
                <div>
                  <div className="text-[11px] text-mutedolive">ยอดที่เลือกออกบิล ({selected.length} รายการ)</div>
                  <div className="font-num font-bold text-lg text-vibrant">{formatBaht(selectedTotal)}</div>
                </div>
                <button
                  disabled={selected.length === 0}
                  onClick={onGoDigital}
                  className="h-11 px-4 rounded-xl bg-vibrant disabled:bg-softsage text-white font-semibold text-sm flex items-center gap-1.5"
                >
                  <Icon name="receipt" className="w-4 h-4" />
                  <span>ออกใบเสร็จ</span>
                </button>
              </div>
            </div>
          )}

          {/* Add Item Bottom Sheet */}
          {showAddSheet && (
            <AddItemBottomSheet
              onClose={() => setShowAddSheet(false)}
              onAdd={(newItem) => {
                updateData((p) => ({ ...p, cartItems: [{ ...newItem, id: uuid(), isSelected: true }, ...p.cartItems] }));
                showToast(`เพิ่ม ${newItem.name} ลงตะกร้าแล้ว`);
                setShowAddSheet(false);
              }}
            />
          )}

          {/* Budget Edit Modal */}
          {showBudgetModal && (
            <BudgetModal
              current={data.budgetLimit}
              onClose={() => setShowBudgetModal(false)}
              onSave={(val) => {
                updateData({ budgetLimit: val });
                showToast(`ตั้งงบเป็น ${formatBaht(val)}`);
                setShowBudgetModal(false);
              }}
            />
          )}

          {/* Item Edit Modal */}
          {editingItem && (
            <EditCartItemModal
              item={editingItem}
              onClose={() => setEditingItem(null)}
              onSave={(qty, price) => {
                updateData((p) => ({
                  ...p,
                  cartItems: p.cartItems.map((c) => (c.id === editingItem.id ? { ...c, quantity: qty, unitPrice: price } : c))
                }));
                setEditingItem(null);
              }}
            />
          )}
        </div>
      );
    }

    function AddItemBottomSheet({ onClose, onAdd }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState(CATEGORIES[0]);
      const [unit, setUnit] = useState(UNITS[0]);
      const [isWeighted, setIsWeighted] = useState(false);
      const [weightKg, setWeightKg] = useState('');
      const [pricePerKg, setPricePerKg] = useState('');
      const [roundingMode, setRoundingMode] = useState('QUARTER_25');
      const [qty, setQty] = useState('1');
      const [unitPrice, setUnitPrice] = useState('');
      const [err, setErr] = useState('');

      const rawWeighted = (parseFloat(weightKg) || 0) * (parseFloat(pricePerKg) || 0);
      const roundedWeighted = roundThaiRetail(rawWeighted, roundingMode);

      const handleSubmit = () => {
        if (!name.trim()) return setErr('กรุณากรอกชื่อสินค้า');
        if (isWeighted) {
          const w = parseFloat(weightKg) || 0;
          const p = parseFloat(pricePerKg) || 0;
          if (w <= 0 || p <= 0) return setErr('กรุณากรอกน้ำหนักและราคา/กก. ให้ถูกต้อง');
          onAdd({ name: name.trim(), category, unit, isWeighted: true, weightKg: w, pricePerKg: p, roundingMode, quantity: 1, unitPrice: roundedWeighted });
        } else {
          const q = parseFloat(qty) || 0;
          const p = parseFloat(unitPrice);
          if (q <= 0 || isNaN(p) || p < 0) return setErr('กรุณากรอกจำนวนและราคาต่อหน่วยให้ถูกต้อง');
          onAdd({ name: name.trim(), category, unit, isWeighted: false, weightKg: 0, pricePerKg: 0, roundingMode: 'NONE', quantity: q, unitPrice: p });
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 pb-8 max-h-[90dvh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-softsage">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-full bg-softolive text-deepolive flex items-center justify-center"><Icon name="plus" className="w-4 h-4" /></div>
                <h2 className="font-bold text-base text-deepolive">เพิ่มรายการสินค้า</h2>
              </div>
              <button onClick={onClose} className="p-2 text-mutedolive"><Icon name="close" className="w-5 h-5" /></button>
            </div>

            <div className="mt-3 space-y-3">
              <div>
                <label className="block text-xs font-medium mb-1">ชื่อสินค้า / วัตถุดิบ</label>
                <input
                  value={name}
                  onChange={(e) => { setName(e.target.value); setErr(''); }}
                  placeholder="เช่น สันในไก่, คะน้า, น้ำปลา"
                  className="w-full h-11 px-3 rounded-xl border border-sageborder focus:outline-none focus:border-olive text-sm"
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1.5">หมวดหมู่</label>
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {CATEGORIES.map((c) => (
                    <button
                      key={c}
                      onClick={() => setCategory(c)}
                      className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap border ${
                        category === c ? 'bg-olive text-white border-olive' : 'bg-white text-charcoal border-sageborder'
                      }`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium mb-1.5">หน่วยนับ</label>
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {UNITS.map((u) => (
                    <button
                      key={u}
                      onClick={() => setUnit(u)}
                      className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap border ${
                        unit === u ? 'bg-deepolive text-white border-deepolive' : 'bg-white text-charcoal border-sageborder'
                      }`}
                    >
                      {u}
                    </button>
                  ))}
                </div>
              </div>

              {/* Weighted Toggle */}
              <div className="p-3 rounded-xl bg-softolive/70 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <Icon name="scale" className="w-5 h-5 text-deepolive shrink-0" />
                  <div>
                    <div className="text-xs font-semibold">สินค้าชั่งน้ำหนัก (แบบแมคโคร)</div>
                    <div className="text-[11px] text-mutedolive">คำนวณน้ำหนัก × ราคา/กก. + ปัดเศษ</div>
                  </div>
                </div>
                <input
                  type="checkbox"
                  checked={isWeighted}
                  onChange={(e) => {
                    setIsWeighted(e.target.checked);
                    if (e.target.checked) setUnit('กิโลกรัม');
                    setErr('');
                  }}
                  className="w-5 h-5 accent-olive"
                />
              </div>

              {isWeighted ? (
                <div className="space-y-2.5">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs mb-1">น้ำหนัก (กก.)</label>
                      <input type="number" step="0.01" inputMode="decimal" value={weightKg} onChange={(e) => setWeightKg(e.target.value)} placeholder="0.45" className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs mb-1">ราคา/กก. (฿)</label>
                      <input type="number" step="0.01" inputMode="decimal" value={pricePerKg} onChange={(e) => setPricePerKg(e.target.value)} placeholder="189" className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
                    </div>
                  </div>
                  <div className="flex gap-1.5 flex-wrap">
                    {[
                      { id: 'NONE', label: 'ไม่ปัดเศษ' },
                      { id: 'QUARTER_25', label: 'ปัด .00/.25/.50/.75' },
                      { id: 'WHOLE_BAHT', label: 'ปัดเต็มบาท' }
                    ].map((r) => (
                      <button
                        key={r.id}
                        onClick={() => setRoundingMode(r.id)}
                        className={`px-2.5 py-1.5 rounded-lg text-[11px] border ${
                          roundingMode === r.id ? 'bg-vibrant text-white border-vibrant' : 'bg-white text-charcoal border-sageborder'
                        }`}
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                  {rawWeighted > 0 && (
                    <div className="px-3 py-2 rounded-xl bg-softorange flex items-center justify-between text-xs">
                      <span>ดิบ {formatBaht(rawWeighted)} → ปัดเป็น</span>
                      <span className="font-num font-bold text-sm text-vibrant">{formatBaht(roundedWeighted)}</span>
                    </div>
                  )}
                </div>
              ) : (
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-xs mb-1">จำนวน</label>
                    <input type="number" step="0.1" inputMode="decimal" value={qty} onChange={(e) => setQty(e.target.value)} className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs mb-1">ราคา/หน่วย (฿)</label>
                    <input type="number" step="0.01" inputMode="decimal" value={unitPrice} onChange={(e) => setUnitPrice(e.target.value)} placeholder="0.00" className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
                  </div>
                </div>
              )}

              {err && <div className="text-xs text-vibrant">{err}</div>}

              <button onClick={handleSubmit} className="w-full h-12 rounded-xl bg-olive text-white font-semibold text-sm flex items-center justify-center gap-1.5">
                <Icon name="plus" className="w-4 h-4" />
                <span>เพิ่มลงรายการซื้อของ</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function BudgetModal({ current, onClose, onSave }) {
      const [val, setVal] = useState(String(current));
      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-xs p-5 border border-sageborder">
            <h3 className="font-bold text-base text-deepolive mb-3">ตั้งงบประมาณต่อรอบ (บาท)</h3>
            <input type="number" inputMode="decimal" value={val} onChange={(e) => setVal(e.target.value)} className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-base" />
            <div className="flex justify-end gap-2 mt-4">
              <button onClick={onClose} className="px-4 h-10 text-sm text-mutedolive">ยกเลิก</button>
              <button onClick={() => onSave(Math.max(0, parseFloat(val) || 0))} className="px-4 h-10 rounded-xl bg-olive text-white text-sm font-semibold">บันทึก</button>
            </div>
          </div>
        </div>
      );
    }

    function EditCartItemModal({ item, onClose, onSave }) {
      const [qty, setQty] = useState(String(item.quantity));
      const [price, setPrice] = useState(String(item.unitPrice));
      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-xs p-5 border border-sageborder space-y-3">
            <h3 className="font-bold text-base text-deepolive truncate">แก้ไข {item.name}</h3>
            <div>
              <label className="block text-xs mb-1">จำนวน ({item.unit})</label>
              <input type="number" step="0.1" inputMode="decimal" value={qty} onChange={(e) => setQty(e.target.value)} className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
            </div>
            <div>
              <label className="block text-xs mb-1">ราคาต่อหน่วย (฿)</label>
              <input type="number" step="0.01" inputMode="decimal" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full h-11 px-3 rounded-xl border border-sageborder font-num text-sm" />
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 h-10 text-sm text-mutedolive">ยกเลิก</button>
              <button onClick={() => onSave(Math.max(0.1, parseFloat(qty) || item.quantity), Math.max(0, parseFloat(price) || 0))} className="px-4 h-10 rounded-xl bg-olive text-white text-sm font-semibold">อัปเดต</button>
            </div>
          </div>
        </div>
      );
    }

    // --- Menu 2: Digital Receipt ---
    function DigitalReceiptTab({ data, updateData, onGoList, onSaved }) {
      const selected = data.cartItems.filter((i) => i.isSelected);
      const [storeName, setStoreName] = useState('Makro');
      const [dateIso, setDateIso] = useState(todayISO());
      const [includeVat, setIncludeVat] = useState(false);
      const [discount, setDiscount] = useState('');
      const [discountBeforeVat, setDiscountBeforeVat] = useState(true);

      const totals = useMemo(
        () => calcReceiptTotals(selected, includeVat, parseFloat(discount) || 0, discountBeforeVat),
        [selected, includeVat, discount, discountBeforeVat]
      );

      if (selected.length === 0) {
        return (
          <div className="px-4 py-16 flex flex-col items-center text-center">
            <div className="w-16 h-16 rounded-full bg-softolive text-olive flex items-center justify-center mb-3"><Icon name="receipt" className="w-8 h-8" /></div>
            <div className="font-semibold text-base">ยังไม่มีรายการสินค้าที่เลือกออกบิล</div>
            <div className="text-xs text-mutedolive mt-1">กลับไปติ๊กเลือกรายการในเมนู List Food แล้วกดออกใบเสร็จ</div>
            <button onClick={onGoList} className="mt-4 h-11 px-5 rounded-xl bg-olive text-white text-sm font-semibold">ไปที่รายการซื้อของ</button>
          </div>
        );
      }

      return (
        <div className="px-4 pt-4 space-y-3.5">
          {/* Store & Date */}
          <div className="bg-white rounded-2xl p-4 border border-sageborder space-y-3">
            <div className="font-semibold text-sm text-deepolive">ข้อมูลสถานที่และวันที่ซื้อ</div>
            <input value={storeName} onChange={(e) => setStoreName(e.target.value)} placeholder="ชื่อร้านค้า" className="w-full h-11 px-3 rounded-xl border border-sageborder text-sm" />
            <div className="flex gap-2 flex-wrap">
              {QUICK_STORES.map((s) => (
                <button key={s} onClick={() => setStoreName(s)} className={`px-3 py-1.5 rounded-full text-xs border ${storeName === s ? 'bg-olive text-white border-olive' : 'bg-white text-charcoal border-sageborder'}`}>{s}</button>
              ))}
            </div>
            <div>
              <label className="block text-xs text-mutedolive mb-1">วันที่ซื้อ</label>
              <input type="date" value={dateIso} onChange={(e) => setDateIso(e.target.value)} className="w-full h-11 px-3 rounded-xl border border-sageborder text-sm font-num" />
            </div>
          </div>

          {/* VAT & Discount */}
          <div className="bg-white rounded-2xl p-4 border border-sageborder space-y-3">
            <div className="font-semibold text-sm text-deepolive">ภาษีมูลค่าเพิ่มและส่วนลด</div>
            <label className="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" checked={includeVat} onChange={(e) => setIncludeVat(e.target.checked)} className="w-4 h-4 accent-olive" />
              <span className="text-sm font-medium">คำนวณภาษีมูลค่าเพิ่ม VAT 7%</span>
            </label>
            <input type="number" step="0.01" inputMode="decimal" value={discount} onChange={(e) => setDiscount(e.target.value)} placeholder="ส่วนลด (บาท)" className="w-full h-11 px-3 rounded-xl border border-sageborder text-sm font-num" />
            {includeVat && (parseFloat(discount) || 0) > 0 && (
              <div className="flex gap-2">
                <button onClick={() => setDiscountBeforeVat(true)} className={`px-3 py-1.5 rounded-full text-xs border ${discountBeforeVat ? 'bg-deepolive text-white border-deepolive' : 'border-sageborder'}`}>หักส่วนลดก่อน VAT</button>
                <button onClick={() => setDiscountBeforeVat(false)} className={`px-3 py-1.5 rounded-full text-xs border ${!discountBeforeVat ? 'bg-deepolive text-white border-deepolive' : 'border-sageborder'}`}>หักส่วนลดหลัง VAT</button>
              </div>
            )}
          </div>

          {/* Minimalist Digital Receipt Card */}
          <div className="bg-white rounded-2xl p-4 border-2 border-deepolive/40 shadow-sm">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2"><MueLaLogo size={26} /><span className="font-num font-bold text-xs text-deepolive">MUE LA RECEIPT</span></div>
              <span className="text-xs text-mutedolive">{formatThaiDate(dateIso)}</span>
            </div>
            <div className="mt-1.5 font-bold text-lg text-charcoal">{storeName.trim() || 'ร้านค้าทั่วไป'}</div>
            <div className="my-3 dashed-divider" />
            <div className="space-y-1.5">
              {selected.map((it) => (
                <div key={it.id} className="flex justify-between items-start text-sm">
                  <div>
                    <div className="font-medium text-charcoal">{it.name}</div>
                    <div className="text-[11px] text-mutedolive">{formatCompact(it.quantity)} {it.unit} × {formatBaht(it.unitPrice)}</div>
                  </div>
                  <span className="font-num font-semibold">{formatBaht(it.quantity * it.unitPrice)}</span>
                </div>
              ))}
            </div>
            <div className="my-3 dashed-divider" />
            <div className="space-y-1 text-xs">
              <div className="flex justify-between"><span className="text-mutedolive">รวมสินค้า ({selected.length} รายการ)</span><span className="font-num">{formatBaht(totals.subtotal)}</span></div>
              {totals.discountApplied > 0 && (
                <div className="flex justify-between text-olive"><span>ส่วนลด ({discountBeforeVat ? 'ก่อน VAT' : 'หลัง VAT'})</span><span className="font-num">-{formatBaht(totals.discountApplied)}</span></div>
              )}
              {includeVat && (
                <>
                  <div className="flex justify-between"><span className="text-mutedolive">ยอดก่อน VAT</span><span className="font-num">{formatBaht(totals.taxableBase)}</span></div>
                  <div className="flex justify-between"><span className="text-mutedolive">VAT 7%</span><span className="font-num">{formatBaht(totals.vatAmount)}</span></div>
                </>
              )}
            </div>
            <div className="mt-3 px-3.5 py-3 rounded-xl bg-softorange flex items-center justify-between">
              <span className="font-bold text-sm">ยอดรวมสุทธิ</span>
              <span className="font-num font-bold text-xl text-vibrant">{formatBaht(totals.grandTotal)}</span>
            </div>
          </div>

          <button
            onClick={() => {
              const newReceipt = {
                id: uuid(),
                storeName: storeName.trim() || 'ร้านค้าทั่วไป',
                dateIso,
                items: selected.map((c) => ({ ...c })),
                includeVat,
                discountBeforeVat,
                ...totals,
                createdAt: Date.now()
              };
              updateData((p) => ({
                ...p,
                receipts: [newReceipt, ...p.receipts].sort((a, b) => b.dateIso.localeCompare(a.dateIso) || b.createdAt - a.createdAt),
                cartItems: p.cartItems.filter((c) => !c.isSelected)
              }));
              onSaved();
            }}
            className="w-full h-12 rounded-2xl bg-olive text-white font-semibold text-sm"
          >
            บันทึกใบเสร็จและล้างตะกร้าที่เลือก
          </button>
        </div>
      );
    }

    // --- Menu 3: Receipt History ---
    function ReceiptHistoryTab({ data, updateData, showToast }) {
      const [query, setQuery] = useState('');
      const [detailId, setDetailId] = useState(null);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return data.receipts;
        return data.receipts.filter((r) =>
          r.storeName.toLowerCase().includes(q) || formatThaiDate(r.dateIso).toLowerCase().includes(q) || r.dateIso.includes(q)
        );
      }, [data.receipts, query]);

      const activeDetail = data.receipts.find((r) => r.id === detailId);

      return (
        <div className="px-4 pt-3 space-y-3">
          <div className="relative">
            <Icon name="search" className="w-4 h-4 text-deepolive absolute left-3.5 top-3.5" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="ค้นหาชื่อร้านค้า หรือ วันที่ (เช่น Makro, พ.ย.)"
              className="w-full h-11 pl-10 pr-4 rounded-2xl bg-white border border-sageborder text-sm focus:outline-none focus:border-olive"
            />
          </div>

          {filtered.length === 0 ? (
            <div className="bg-white rounded-2xl p-8 border border-sageborder text-center text-sm text-mutedolive">
              {data.receipts.length === 0 ? 'ยังไม่มีประวัติใบเสร็จ' : 'ไม่พบใบเสร็จที่ค้นหา'}
            </div>
          ) : (
            <div className="space-y-2.5">
              {filtered.map((r) => (
                <div
                  key={r.id}
                  onClick={() => setDetailId(r.id)}
                  className="bg-white rounded-2xl p-3.5 border border-sageborder flex items-center justify-between cursor-pointer active:scale-[0.99] transition"
                >
                  <div>
                    <div className="font-semibold text-base text-charcoal">{r.storeName}</div>
                    <div className="text-xs text-mutedolive">{formatThaiDate(r.dateIso)} · {r.items.length} รายการ</div>
                  </div>
                  <div className="text-right">
                    <div className="font-num font-bold text-base text-vibrant">{formatBaht(r.grandTotal)}</div>
                    {r.includeVat && <div className="text-[10px] text-deepolive">รวม VAT 7%</div>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {activeDetail && (
            <ReceiptDetailModal
              receipt={activeDetail}
              onClose={() => setDetailId(null)}
              onSaveEdit={(updated) => {
                updateData((p) => ({
                  ...p,
                  receipts: p.receipts.map((r) => (r.id === updated.id ? updated : r)).sort((a, b) => b.dateIso.localeCompare(a.dateIso))
                }));
                showToast('แก้ไขใบเสร็จเรียบร้อย');
              }}
              onDelete={() => {
                updateData((p) => ({ ...p, receipts: p.receipts.filter((r) => r.id !== activeDetail.id) }));
                setDetailId(null);
                showToast('ลบใบเสร็จแล้ว');
              }}
            />
          )}
        </div>
      );
    }

    function ReceiptDetailModal({ receipt, onClose, onSaveEdit, onDelete }) {
      const [isEditing, setIsEditing] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [store, setStore] = useState(receipt.storeName);
      const [dateIso, setDateIso] = useState(receipt.dateIso);
      const [items, setItems] = useState(receipt.items);
      const [vat, setVat] = useState(receipt.includeVat);
      const [discount, setDiscount] = useState(receipt.discountApplied ? String(receipt.discountApplied) : '');
      const [beforeVat, setBeforeVat] = useState(receipt.discountBeforeVat);

      const totals = calcReceiptTotals(items, vat, parseFloat(discount) || 0, beforeVat);

      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-md max-h-[88dvh] overflow-y-auto p-5 border border-sageborder">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2"><MueLaLogo size={24} /><h3 className="font-bold text-base text-deepolive">{isEditing ? 'แก้ไขใบเสร็จ' : 'รายละเอียดใบเสร็จ'}</h3></div>
              <div className="flex items-center gap-1">
                {!isEditing && (
                  <>
                    <button onClick={() => { setConfirmDelete(false); setIsEditing(true); }} className="p-2 text-deepolive" aria-label="แก้ไขใบเสร็จ"><Icon name="edit" className="w-4 h-4" /></button>
                    <button onClick={() => setConfirmDelete(true)} className="p-2 text-vibrant" aria-label="ลบใบเสร็จ"><Icon name="trash" className="w-4 h-4" /></button>
                  </>
                )}
                <button onClick={onClose} className="p-2 text-mutedolive" aria-label="ปิด"><Icon name="close" className="w-5 h-5" /></button>
              </div>
            </div>

            {confirmDelete && !isEditing && (
              <div className="mb-3 p-3 rounded-2xl bg-softorange border border-vibrant/40 flex items-center justify-between gap-2">
                <span className="text-xs font-semibold text-vibrant">ยืนยันลบใบเสร็จนี้?</span>
                <div className="flex gap-1.5">
                  <button onClick={() => setConfirmDelete(false)} className="px-3 h-8 rounded-lg bg-white text-xs text-mutedolive border border-sageborder">ยกเลิก</button>
                  <button onClick={onDelete} className="px-3 h-8 rounded-lg bg-vibrant text-white text-xs font-semibold">ลบเลย</button>
                </div>
              </div>
            )}

            {isEditing ? (
              <div className="space-y-2.5">
                <input value={store} onChange={(e) => setStore(e.target.value)} placeholder="ชื่อร้านค้า" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm" />
                <input type="date" value={dateIso} onChange={(e) => setDateIso(e.target.value)} className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm font-num" />
                {items.map((it, idx) => (
                  <div key={it.id} className="p-2.5 rounded-xl bg-mintbg space-y-1.5">
                    <div className="font-medium text-xs">{it.name}</div>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" step="0.1" inputMode="decimal" value={it.quantity} onChange={(e) => {
                        const q = Math.max(0.1, parseFloat(e.target.value) || 0.1);
                        setItems((prev) => prev.map((x, i) => (i === idx ? { ...x, quantity: q } : x)));
                      }} className="h-9 px-2 rounded-lg border border-sageborder bg-white text-xs font-num" />
                      <input type="number" step="0.01" inputMode="decimal" value={it.unitPrice} onChange={(e) => {
                        const p = Math.max(0, parseFloat(e.target.value) || 0);
                        setItems((prev) => prev.map((x, i) => (i === idx ? { ...x, unitPrice: p } : x)));
                      }} className="h-9 px-2 rounded-lg border border-sageborder bg-white text-xs font-num" />
                    </div>
                  </div>
                ))}
                <label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={vat} onChange={(e) => setVat(e.target.checked)} className="accent-olive" /> VAT 7%</label>
                <input type="number" step="0.01" inputMode="decimal" value={discount} onChange={(e) => setDiscount(e.target.value)} placeholder="ส่วนลด (บาท)" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm font-num" />
                {vat && (parseFloat(discount) || 0) > 0 && (
                  <div className="flex gap-2">
                    <button onClick={() => setBeforeVat(true)} className={`px-3 py-1.5 rounded-full text-xs border ${beforeVat ? 'bg-deepolive text-white border-deepolive' : 'border-sageborder'}`}>ลดก่อน VAT</button>
                    <button onClick={() => setBeforeVat(false)} className={`px-3 py-1.5 rounded-full text-xs border ${!beforeVat ? 'bg-deepolive text-white border-deepolive' : 'border-sageborder'}`}>ลดหลัง VAT</button>
                  </div>
                )}
                <div className="flex justify-between text-sm font-bold pt-2"><span>ยอดสุทธิใหม่</span><span className="font-num text-vibrant">{formatBaht(totals.grandTotal)}</span></div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setIsEditing(false)} className="flex-1 h-10 rounded-xl border border-sageborder text-xs">ยกเลิก</button>
                  <button onClick={() => { onSaveEdit({ ...receipt, storeName: store.trim() || 'ร้านค้าทั่วไป', dateIso, items, includeVat: vat, discountBeforeVat: beforeVat, ...totals }); setIsEditing(false); }} className="flex-1 h-10 rounded-xl bg-olive text-white text-xs font-semibold">บันทึก</button>
                </div>
              </div>
            ) : (
              <div>
                <div className="font-bold text-lg">{receipt.storeName}</div>
                <div className="text-xs text-mutedolive">{formatThaiDate(receipt.dateIso)}</div>
                <div className="my-3 dashed-divider" />
                <div className="space-y-1.5">
                  {receipt.items.map((it) => (
                    <div key={it.id} className="flex justify-between text-sm">
                      <div><div>{it.name}</div><div className="text-[11px] text-mutedolive">{formatCompact(it.quantity)} {it.unit} × {formatBaht(it.unitPrice)}</div></div>
                      <span className="font-num font-semibold">{formatBaht(it.quantity * it.unitPrice)}</span>
                    </div>
                  ))}
                </div>
                <div className="my-3 dashed-divider" />
                <div className="space-y-1 text-xs">
                  <div className="flex justify-between"><span className="text-mutedolive">รวมสินค้า</span><span className="font-num">{formatBaht(receipt.subtotal)}</span></div>
                  {receipt.discountApplied > 0 && <div className="flex justify-between text-olive"><span>ส่วนลด</span><span className="font-num">-{formatBaht(receipt.discountApplied)}</span></div>}
                  {receipt.includeVat && <div className="flex justify-between"><span className="text-mutedolive">VAT 7%</span><span className="font-num">{formatBaht(receipt.vatAmount)}</span></div>}
                </div>
                <div className="mt-3 px-3.5 py-2.5 rounded-xl bg-softorange flex justify-between items-center">
                  <span className="font-bold text-sm">ยอดรวมสุทธิ</span>
                  <span className="font-num font-bold text-lg text-vibrant">{formatBaht(receipt.grandTotal)}</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Menu 4: Meal Note ---
    function MealNoteTab({ data, updateData, showToast }) {
      const [working, setWorking] = useState([]);
      const [wholeMode, setWholeMode] = useState(false);
      const [wholeCount, setWholeCount] = useState(4);
      const [showReceiptPicker, setShowReceiptPicker] = useState(false);
      const [showManualModal, setShowManualModal] = useState(false);
      const [showSavePlanModal, setShowSavePlanModal] = useState(false);
      const [planTitle, setPlanTitle] = useState('');

      const totalCost = working.reduce((s, i) => s + i.cost, 0);
      const totalMeals = working.length === 0 ? 0 : wholeMode ? wholeCount : working.reduce((s, i) => s + i.estimatedMeals, 0);
      const days = totalMeals === 0 ? 0 : totalMeals / Math.max(1, data.mealsPerDay);
      const costPerMeal = totalMeals === 0 ? 0 : totalCost / totalMeals;

      return (
        <div className="px-4 pt-4 space-y-3">
          {/* Baseline Meals/Day */}
          <div className="bg-white rounded-2xl p-4 border border-sageborder flex items-center justify-between">
            <div>
              <div className="font-semibold text-sm text-deepolive">เกณฑ์การกินต่อวัน</div>
              <div className="text-xs text-mutedolive">ใช้คำนวณจำนวนวันที่วัตถุดิบจะอยู่ได้</div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => updateData({ mealsPerDay: Math.max(1, data.mealsPerDay - 1) })} className="w-9 h-9 rounded-full bg-softsage flex items-center justify-center"><Icon name="minus" className="w-4 h-4" /></button>
              <span className="font-bold text-sm min-w-[60px] text-center">{data.mealsPerDay} มื้อ/วัน</span>
              <button onClick={() => updateData({ mealsPerDay: Math.min(10, data.mealsPerDay + 1) })} className="w-9 h-9 rounded-full bg-softolive text-deepolive flex items-center justify-center"><Icon name="plus" className="w-4 h-4" /></button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2.5">
            <button onClick={() => setShowReceiptPicker(true)} className="h-11 rounded-xl border border-olive text-deepolive font-medium text-xs flex items-center justify-center gap-1.5 bg-white">
              <Icon name="receipt" className="w-4 h-4" />
              <span>ดึงจากใบเสร็จ</span>
            </button>
            <button onClick={() => setShowManualModal(true)} className="h-11 rounded-xl bg-olive text-white font-medium text-xs flex items-center justify-center gap-1.5">
              <Icon name="plus" className="w-4 h-4" />
              <span>เพิ่มวัตถุดิบเอง</span>
            </button>
          </div>

          {working.length > 0 && (
            <>
              <div className="bg-white rounded-2xl p-3.5 border border-sageborder space-y-2.5">
                <div className="flex gap-2">
                  <button onClick={() => setWholeMode(false)} className={`px-3 py-1.5 rounded-full text-xs border ${!wholeMode ? 'bg-olive text-white border-olive' : 'border-sageborder'}`}>ระบุรายวัตถุดิบ</button>
                  <button onClick={() => setWholeMode(true)} className={`px-3 py-1.5 rounded-full text-xs border ${wholeMode ? 'bg-olive text-white border-olive' : 'border-sageborder'}`}>แบ่งรวมทั้งชุด</button>
                </div>
                {wholeMode && (
                  <div className="flex items-center justify-between pt-1">
                    <span className="text-xs">ชุดนี้กินได้รวมทั้งหมด</span>
                    <div className="flex items-center gap-2">
                      <button onClick={() => setWholeCount((c) => Math.max(1, c - 1))} className="w-8 h-8 rounded-full bg-softsage flex items-center justify-center"><Icon name="minus" className="w-3.5 h-3.5" /></button>
                      <span className="font-bold text-sm text-deepolive">{wholeCount} มื้อ</span>
                      <button onClick={() => setWholeCount((c) => c + 1)} className="w-8 h-8 rounded-full bg-softolive text-deepolive flex items-center justify-center"><Icon name="plus" className="w-3.5 h-3.5" /></button>
                    </div>
                  </div>
                )}
              </div>

              {working.map((ing) => (
                <div key={ing.id} className="bg-white rounded-2xl px-3.5 py-2.5 border border-sageborder flex items-center justify-between gap-2">
                  <div className="min-w-0 flex-1">
                    <div className="font-semibold text-sm truncate">{ing.name}</div>
                    <div className="text-xs text-deepolive font-num">{formatBaht(ing.cost)} <span className="text-mutedolive font-prompt">· {ing.source}</span></div>
                  </div>
                  {!wholeMode && (
                    <div className="flex items-center gap-1.5">
                      <button onClick={() => setWorking((p) => p.map((x) => x.id === ing.id ? { ...x, estimatedMeals: Math.max(1, x.estimatedMeals - 1) } : x))} className="w-7 h-7 rounded-full bg-softsage flex items-center justify-center"><Icon name="minus" className="w-3 h-3" /></button>
                      <span className="text-xs font-medium min-w-[44px] text-center">{ing.estimatedMeals} มื้อ</span>
                      <button onClick={() => setWorking((p) => p.map((x) => x.id === ing.id ? { ...x, estimatedMeals: x.estimatedMeals + 1 } : x))} className="w-7 h-7 rounded-full bg-softolive text-deepolive flex items-center justify-center"><Icon name="plus" className="w-3 h-3" /></button>
                    </div>
                  )}
                  <button onClick={() => setWorking((p) => p.filter((x) => x.id !== ing.id))} className="p-1.5 text-vibrant"><Icon name="trash" className="w-4 h-4" /></button>
                </div>
              ))}

              <div className="bg-white rounded-2xl p-4 border-2 border-olive space-y-3">
                <div className="font-bold text-sm text-deepolive">ผลคำนวณต้นทุนมื้ออาหาร</div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="p-2.5 rounded-xl bg-mintbg"><div className="text-[11px] text-mutedolive">กินได้ทั้งหมด</div><div className="font-num font-bold text-sm text-deepolive">{totalMeals} มื้อ</div></div>
                  <div className="p-2.5 rounded-xl bg-mintbg"><div className="text-[11px] text-mutedolive">กินได้นาน</div><div className="font-num font-bold text-sm text-deepolive">{formatCompact(days)} วัน</div></div>
                  <div className="p-2.5 rounded-xl bg-softorange"><div className="text-[11px] text-mutedolive">เฉลี่ยมื้อละ</div><div className="font-num font-bold text-sm text-vibrant">{formatBaht(costPerMeal)}</div></div>
                </div>
                <button
                  onClick={() => { setPlanTitle(''); setShowSavePlanModal(true); }}
                  className="w-full h-11 rounded-xl bg-vibrant text-white font-semibold text-sm"
                >
                  สรุปมื้ออาหาร (บันทึกการ์ด)
                </button>
              </div>
            </>
          )}

          {data.mealPlans.length > 0 && (
            <div className="space-y-2.5 pt-2">
              <div className="font-bold text-sm text-deepolive">ประวัติการ์ดสรุปมื้ออาหาร ({data.mealPlans.length})</div>
              {data.mealPlans.map((pl) => (
                <div key={pl.id} className="bg-white rounded-2xl p-4 border border-deepolive/40">
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-2"><MueLaLogo size={22} /><span className="font-bold text-sm">{pl.title}</span></div>
                    <button onClick={() => updateData((p) => ({ ...p, mealPlans: p.mealPlans.filter((x) => x.id !== pl.id) }))} className="text-vibrant p-1"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                  <div className="my-2.5 dashed-divider" />
                  {pl.ingredients.map((ing) => (
                    <div key={ing.id} className="flex justify-between text-xs py-0.5">
                      <span>• {ing.name}</span>
                      <span className="font-num text-mutedolive">{formatBaht(ing.cost)}</span>
                    </div>
                  ))}
                  <div className="my-2.5 dashed-divider" />
                  <div className="flex justify-between items-center">
                    <div className="text-xs text-mutedolive">รวม {formatBaht(pl.totalCost)} · {pl.totalMeals} มื้อ · อยู่ได้ {formatCompact(pl.estimatedDays)} วัน</div>
                    <div className="px-2.5 py-1 rounded-lg bg-softorange text-right">
                      <div className="text-[10px] text-mutedolive">เฉลี่ยมื้อละ</div>
                      <div className="font-num font-bold text-sm text-vibrant">{formatBaht(pl.costPerMeal)}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {showReceiptPicker && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[75dvh] overflow-y-auto space-y-2.5">
                <div className="flex justify-between items-center mb-1"><h3 className="font-bold text-base text-deepolive">เลือกใบเสร็จที่ต้องการนำเข้า</h3><button onClick={() => setShowReceiptPicker(false)}><Icon name="close" className="w-5 h-5" /></button></div>
                {data.receipts.length === 0 ? <div className="text-sm text-mutedolive py-4">ยังไม่มีใบเสร็จที่บันทึกไว้</div> : data.receipts.map((r) => (
                  <div
                    key={r.id}
                    onClick={() => {
                      const sub = r.items.reduce((s, i) => s + i.quantity * i.unitPrice, 0) || 1;
                      const ratio = r.subtotal > 0 ? r.grandTotal / sub : 1;
                      const imported = r.items.map((it) => ({
                        id: uuid(),
                        name: it.name,
                        cost: Math.round(it.quantity * it.unitPrice * ratio * 100) / 100,
                        estimatedMeals: 2,
                        source: r.storeName
                      }));
                      setWorking((prev) => [...prev, ...imported]);
                      setShowReceiptPicker(false);
                      showToast(`ดึงวัตถุดิบ ${imported.length} รายการจาก ${r.storeName}`);
                    }}
                    className="p-3 rounded-xl bg-mintbg border border-sageborder flex justify-between items-center cursor-pointer"
                  >
                    <div><div className="font-semibold text-sm">{r.storeName}</div><div className="text-xs text-mutedolive">{formatThaiDate(r.dateIso)} · {r.items.length} รายการ</div></div>
                    <span className="font-num font-bold text-sm text-vibrant">{formatBaht(r.grandTotal)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {showManualModal && (
            <ManualIngredientModal
              onClose={() => setShowManualModal(false)}
              onAdd={(name, cost, meals) => {
                setWorking((prev) => [...prev, { id: uuid(), name, cost, estimatedMeals: meals, source: 'เพิ่มเอง' }]);
                setShowManualModal(false);
              }}
            />
          )}

          {showSavePlanModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-xs p-5 border border-sageborder space-y-3">
                <h3 className="font-bold text-base text-deepolive">บันทึกการ์ดสรุปมื้ออาหาร</h3>
                <p className="text-xs text-mutedolive">ตั้งชื่อชุดอาหาร (หรือเว้นว่างเพื่อใช้วันที่ปัจจุบัน)</p>
                <input
                  value={planTitle}
                  onChange={(e) => setPlanTitle(e.target.value)}
                  placeholder={`สรุปมื้ออาหาร ${formatThaiDate(todayISO())}`}
                  className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm"
                />
                <div className="flex justify-end gap-2 pt-1">
                  <button onClick={() => setShowSavePlanModal(false)} className="px-4 h-10 text-sm text-mutedolive">ยกเลิก</button>
                  <button
                    onClick={() => {
                      const plan = {
                        id: uuid(),
                        title: planTitle.trim() || `สรุปมื้ออาหาร ${formatThaiDate(todayISO())}`,
                        mealsPerDay: data.mealsPerDay,
                        ingredients: working,
                        totalCost,
                        totalMeals,
                        estimatedDays: days,
                        costPerMeal
                      };
                      updateData((p) => ({ ...p, mealPlans: [plan, ...p.mealPlans] }));
                      setWorking([]);
                      setShowSavePlanModal(false);
                      showToast('บันทึกการ์ดสรุปมื้ออาหารเรียบร้อย');
                    }}
                    className="px-4 h-10 rounded-xl bg-vibrant text-white text-sm font-semibold"
                  >
                    บันทึกการ์ด
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ManualIngredientModal({ onClose, onAdd }) {
      const [name, setName] = useState('');
      const [cost, setCost] = useState('');
      const [meals, setMeals] = useState('2');
      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-xs p-5 border border-sageborder space-y-3">
            <h3 className="font-bold text-base text-deepolive">เพิ่มวัตถุดิบด้วยตัวเอง</h3>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="ชื่อวัตถุดิบ" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm" />
            <input type="number" inputMode="decimal" value={cost} onChange={(e) => setCost(e.target.value)} placeholder="ราคา / ต้นทุน (บาท)" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm font-num" />
            <input type="number" inputMode="numeric" value={meals} onChange={(e) => setMeals(e.target.value)} placeholder="จำนวนมื้อที่แบ่งกินได้" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm font-num" />
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 h-10 text-sm text-mutedolive">ยกเลิก</button>
              <button onClick={() => { if (name.trim()) onAdd(name.trim(), Math.max(0, parseFloat(cost) || 0), Math.max(1, parseInt(meals) || 1)); }} className="px-4 h-10 rounded-xl bg-olive text-white text-sm font-semibold">เพิ่ม</button>
            </div>
          </div>
        </div>
      );
    }

    // --- Menu 5: Weekly Food ---
    function WeeklyFoodTab({ data, updateData, showToast }) {
      const [subTab, setSubTab] = useState('ACTIVE');
      const [slotTarget, setSlotTarget] = useState(null); // { dayIndex, slotKey, slotLabel, entry }
      const [historyDetail, setHistoryDetail] = useState(null);

      const today = todayISO();
      const days = data.weeklyDays;
      const todayRec = days.find((d) => d.dateIso === today);
      const todayTotal = todayRec ? (todayRec.meal1.cost + todayRec.meal2.cost + todayRec.snack.cost) : (days[0] ? days[0].meal1.cost + days[0].meal2.cost + days[0].snack.cost : 0);

      const totalMeals = days.reduce((s, d) => s + [d.meal1, d.meal2, d.snack].filter((m) => m.name || m.cost > 0).length, 0);
      const weekTotal = days.reduce((s, d) => s + d.meal1.cost + d.meal2.cost + d.snack.cost, 0);
      const avgMeal = totalMeals > 0 ? weekTotal / totalMeals : 0;

      return (
        <div>
          <div className="bg-white border-b border-sageborder grid grid-cols-2">
            <button onClick={() => setSubTab('ACTIVE')} className={`h-11 text-sm ${subTab === 'ACTIVE' ? 'border-b-2 border-olive text-deepolive font-semibold' : 'text-mutedolive'}`}>ตารางสัปดาห์นี้</button>
            <button onClick={() => setSubTab('HISTORY')} className={`h-11 text-sm ${subTab === 'HISTORY' ? 'border-b-2 border-olive text-deepolive font-semibold' : 'text-mutedolive'}`}>คลังประวัติ ({data.weeklyHistory.length})</button>
          </div>

          {subTab === 'ACTIVE' ? (
            <div className="px-4 pt-3 space-y-3">
              <div className="bg-white rounded-2xl p-4 border border-sageborder space-y-3">
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <div className="font-semibold text-sm text-deepolive">สัปดาห์ 7 วัน</div>
                    <div className="text-xs text-mutedolive">{formatThaiDate(data.weeklyStartIso)} - {formatThaiDate(addDaysISO(data.weeklyStartIso, 6))}</div>
                  </div>
                  <input
                    type="date"
                    value={data.weeklyStartIso}
                    onChange={(e) => {
                      const start = e.target.value;
                      if (!start) return;
                      updateData((p) => ({
                        ...p,
                        weeklyStartIso: start,
                        weeklyDays: p.weeklyDays.map((d, idx) => ({ ...d, dateIso: addDaysISO(start, idx) }))
                      }));
                    }}
                    className="h-10 px-2.5 rounded-xl border border-olive text-xs font-num text-deepolive"
                  />
                </div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="p-2.5 rounded-xl bg-mintbg"><div className="text-[10.5px] text-mutedolive">{todayRec ? 'วันนี้กินไป' : 'วันแรก'}</div><div className="font-num font-bold text-sm text-deepolive">{formatBaht(todayTotal)}</div></div>
                  <div className="p-2.5 rounded-xl bg-mintbg"><div className="text-[10.5px] text-mutedolive">เฉลี่ยมื้อละ</div><div className="font-num font-bold text-sm text-deepolive">{formatBaht(avgMeal)}</div></div>
                  <div className="p-2.5 rounded-xl bg-softorange"><div className="text-[10.5px] text-mutedolive">สะสมสัปดาห์</div><div className="font-num font-bold text-sm text-vibrant">{formatBaht(weekTotal)}</div></div>
                </div>
              </div>

              {days.map((d) => {
                const daySum = d.meal1.cost + d.meal2.cost + d.snack.cost;
                const isToday = d.dateIso === today;
                return (
                  <div key={d.dayIndex} className={`bg-white rounded-2xl p-3.5 border ${isToday ? 'border-olive' : 'border-sageborder'}`}>
                    <div className="flex justify-between items-center mb-2">
                      <div className="flex items-center gap-1.5">
                        <span className={`font-bold text-sm ${isToday ? 'text-deepolive' : 'text-charcoal'}`}>{formatThaiDayDate(d.dateIso)}</span>
                        {isToday && <span className="px-1.5 py-0.5 rounded bg-softolive text-deepolive text-[10px] font-semibold">วันนี้</span>}
                      </div>
                      <span className={`font-num font-bold text-sm ${daySum > 0 ? 'text-vibrant' : 'text-mutedolive'}`}>{formatBaht(daySum)}</span>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { key: 'meal1', label: 'มื้อที่ 1', entry: d.meal1 },
                        { key: 'meal2', label: 'มื้อที่ 2', entry: d.meal2 },
                        { key: 'snack', label: 'ของว่าง', entry: d.snack }
                      ].map((slot) => {
                        const logged = slot.entry.name || slot.entry.cost > 0;
                        return (
                          <button
                            key={slot.key}
                            onClick={() => setSlotTarget({ dayIndex: d.dayIndex, dateIso: d.dateIso, slotKey: slot.key, slotLabel: slot.label, entry: slot.entry })}
                            className={`h-[70px] p-2 rounded-xl border text-left flex flex-col justify-between ${
                              logged ? 'bg-softolive border-olive/60' : 'bg-mintbg border-sageborder'
                            }`}
                          >
                            <span className="text-[10px] text-mutedolive">{slot.label}</span>
                            {logged ? (
                              <div>
                                <div className="text-[11px] font-semibold truncate">{slot.entry.name || 'มื้ออาหาร'}</div>
                                <div className="font-num font-bold text-xs text-deepolive">{formatBaht(slot.entry.cost)}</div>
                              </div>
                            ) : (
                              <span className="text-xs text-olive font-medium">+ บันทึก</span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              <button
                onClick={() => {
                  if (totalMeals === 0) return showToast('ยังไม่มีรายการมื้ออาหารที่บันทึกในสัปดาห์นี้');
                  const hist = {
                    id: uuid(),
                    weekStartIso: data.weeklyStartIso,
                    weekEndIso: addDaysISO(data.weeklyStartIso, 6),
                    days,
                    totalMeals,
                    totalSpent: weekTotal,
                    avgCostPerMeal: avgMeal
                  };
                  updateData((p) => ({
                    ...p,
                    weeklyHistory: [hist, ...p.weeklyHistory],
                    weeklyDays: buildEmptyWeek(p.weeklyStartIso)
                  }));
                  showToast('บันทึกสัปดาห์เข้าสู่คลังประวัติแล้ว');
                }}
                className="w-full h-12 rounded-2xl bg-vibrant text-white font-semibold text-sm"
              >
                บันทึกสัปดาห์นี้เข้าสู่คลังประวัติ
              </button>
            </div>
          ) : (
            <div className="px-4 pt-3 space-y-2.5">
              {data.weeklyHistory.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 border border-sageborder text-center text-sm text-mutedolive">ยังไม่มีประวัติรายสัปดาห์</div>
              ) : data.weeklyHistory.map((h) => (
                <div key={h.id} onClick={() => setHistoryDetail(h)} className="bg-white rounded-2xl p-3.5 border border-sageborder flex justify-between items-center cursor-pointer">
                  <div>
                    <div className="font-semibold text-sm">{formatThaiDayDate(h.weekStartIso)} - {formatThaiDayDate(h.weekEndIso)}</div>
                    <div className="text-xs text-mutedolive">กินทั้งหมด {h.totalMeals} มื้อ · เฉลี่ย {formatBaht(h.avgCostPerMeal)}/มื้อ</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="font-num font-bold text-base text-vibrant">{formatBaht(h.totalSpent)}</span>
                    <button onClick={(e) => { e.stopPropagation(); updateData((p) => ({ ...p, weeklyHistory: p.weeklyHistory.filter((x) => x.id !== h.id) })); }} className="p-1.5 text-mutedolive"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {slotTarget && (
            <LogSlotModal
              target={slotTarget}
              mealPlans={data.mealPlans}
              onClose={() => setSlotTarget(null)}
              onSave={(entry) => {
                updateData((p) => ({
                  ...p,
                  weeklyDays: p.weeklyDays.map((d) => d.dayIndex === slotTarget.dayIndex ? { ...d, [slotTarget.slotKey]: entry } : d)
                }));
                setSlotTarget(null);
              }}
            />
          )}

          {historyDetail && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-md max-h-[85dvh] overflow-y-auto p-5 border border-sageborder">
                <div className="flex justify-between items-center mb-2">
                  <div className="flex items-center gap-2"><MueLaLogo size={24} /><h3 className="font-bold text-base text-deepolive">สรุปการกินรายสัปดาห์</h3></div>
                  <button onClick={() => setHistoryDetail(null)}><Icon name="close" className="w-5 h-5" /></button>
                </div>
                <div className="text-xs text-mutedolive">{formatThaiDate(historyDetail.weekStartIso)} - {formatThaiDate(historyDetail.weekEndIso)}</div>
                <div className="my-3 dashed-divider" />
                <div className="space-y-2">
                  {historyDetail.days.map((d) => {
                    const sum = d.meal1.cost + d.meal2.cost + d.snack.cost;
                    const txt = [d.meal1, d.meal2, d.snack].filter((m) => m.name || m.cost > 0).map((m) => `${m.name} (${formatBaht(m.cost)})`).join(' · ');
                    return (
                      <div key={d.dayIndex} className="flex justify-between items-start text-xs">
                        <div><div className="font-semibold">{formatThaiDayDate(d.dateIso)}</div><div className="text-mutedolive">{txt || 'ไม่มีรายการ'}</div></div>
                        <span className="font-num font-semibold text-deepolive">{formatBaht(sum)}</span>
                      </div>
                    );
                  })}
                </div>
                <div className="my-3 dashed-divider" />
                <div className="px-3.5 py-2.5 rounded-xl bg-softorange flex justify-between items-center">
                  <span className="font-bold text-sm">ยอดรวมทั้งสัปดาห์ ({historyDetail.totalMeals} มื้อ)</span>
                  <span className="font-num font-bold text-lg text-vibrant">{formatBaht(historyDetail.totalSpent)}</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LogSlotModal({ target, mealPlans, onClose, onSave }) {
      const [mode, setMode] = useState(mealPlans.length > 0 && !target.entry.name ? 'PLAN' : 'CUSTOM');
      const [name, setName] = useState(target.entry.name || '');
      const [cost, setCost] = useState(target.entry.cost > 0 ? String(target.entry.cost) : '');

      return (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl w-full max-w-sm p-5 border border-sageborder space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-base text-deepolive">{target.slotLabel} · {formatThaiDayDate(target.dateIso)}</h3>
              <button onClick={onClose}><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setMode('PLAN')} className={`px-3 py-1.5 rounded-full text-xs border ${mode === 'PLAN' ? 'bg-olive text-white border-olive' : 'border-sageborder'}`}>ดึงจาก Meal Note</button>
              <button onClick={() => setMode('CUSTOM')} className={`px-3 py-1.5 rounded-full text-xs border ${mode === 'CUSTOM' ? 'bg-olive text-white border-olive' : 'border-sageborder'}`}>กรอกเอง</button>
            </div>
            {mode === 'PLAN' ? (
              <div className="max-h-56 overflow-y-auto space-y-2">
                {mealPlans.length === 0 ? <div className="text-xs text-mutedolive">ยังไม่มีการ์ดสรุปจาก Meal Note — เลือก "กรอกเอง" ได้ทันที</div> : mealPlans.map((pl) => (
                  <div
                    key={pl.id}
                    onClick={() => onSave({ name: pl.title, cost: Math.round(pl.costPerMeal * 100) / 100 })}
                    className="p-3 rounded-xl bg-mintbg border border-sageborder flex justify-between items-center cursor-pointer"
                  >
                    <div><div className="font-semibold text-sm">{pl.title}</div><div className="text-[11px] text-mutedolive">{pl.totalMeals} มื้อ</div></div>
                    <span className="font-num font-bold text-xs text-vibrant">{formatBaht(pl.costPerMeal)}/มื้อ</span>
                  </div>
                ))}
              </div>
            ) : (
              <div className="space-y-2.5">
                <input value={name} onChange={(e) => setName(e.target.value)} placeholder="ชื่อเมนูอาหาร" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm" />
                <input type="number" step="0.01" inputMode="decimal" value={cost} onChange={(e) => setCost(e.target.value)} placeholder="ราคา (บาท)" className="w-full h-10 px-3 rounded-xl border border-sageborder text-sm font-num" />
                <div className="flex gap-2">
                  {(target.entry.name || target.entry.cost > 0) && (
                    <button onClick={() => onSave({ name: '', cost: 0 })} className="flex-1 h-10 rounded-xl border border-vibrant text-vibrant text-xs font-medium">ล้างช่อง</button>
                  )}
                  <button onClick={() => onSave({ name: name.trim() || target.slotLabel, cost: Math.max(0, parseFloat(cost) || 0) })} className="flex-[1.5] h-10 rounded-xl bg-olive text-white text-xs font-semibold">บันทึกมื้อนี้</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
